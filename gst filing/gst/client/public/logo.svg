<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- FinSync: Bright Professional Fintech Logo -->
  <defs>
    <linearGradient id="brightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="brightGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle for better visibility -->
  <circle cx="20" cy="20" r="19" fill="rgba(96, 165, 250, 0.1)" stroke="rgba(96, 165, 250, 0.2)" stroke-width="1"/>
  
  <!-- Main FinTech Symbol: Modern 'F' with financial elements -->
  <g filter="url(#brightGlow)">
    <!-- Stylized 'F' with modern design -->
    <rect x="7" y="8" width="4" height="24" rx="2" fill="url(#brightGradient)"/>
    <rect x="7" y="8" width="18" height="4" rx="2" fill="url(#brightGradient)"/>
    <rect x="7" y="18" width="14" height="4" rx="2" fill="url(#brightGradient)"/>
    
    <!-- Financial chart bars representing growth -->
    <rect x="28" y="20" width="3" height="12" rx="1.5" fill="#60a5fa"/>
    <rect x="32" y="16" width="3" height="16" rx="1.5" fill="#3b82f6"/>
    <rect x="36" y="12" width="3" height="20" rx="1.5" fill="#93c5fd"/>
  </g>
  
  <!-- Rising trend arrow -->
  <g stroke="url(#accentGradient)" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M12 28 L16 24 L20 20 L24 16"/>
    <!-- Arrow head -->
    <path d="M21 16 L24 16 L24 19" stroke="#06b6d4" stroke-width="2"/>
  </g>
  
  <!-- Modern tech dots for connectivity -->
  <circle cx="26" cy="10" r="1.5" fill="#06b6d4"/>
  <circle cx="30" cy="6" r="1" fill="#60a5fa"/>
  <circle cx="34" y="34" r="1" fill="#93c5fd"/>
  
  <!-- Financial symbols -->
  <g fill="#06b6d4" font-family="Arial, sans-serif" font-size="8" font-weight="bold">
    <text x="15" y="36" text-anchor="middle">$</text>
  </g>
</svg>