<svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faviconAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="rgba(6, 182, 212, 0.1)" stroke="rgba(34, 211, 238, 0.4)" stroke-width="1"/>
  
  <!-- Main FinTech Symbol -->
  <g>
    <!-- Stylized 'F' -->
    <rect x="7" y="8" width="4" height="24" rx="2" fill="url(#faviconGradient)"/>
    <rect x="7" y="8" width="18" height="4" rx="2" fill="url(#faviconGradient)"/>
    <rect x="7" y="18" width="14" height="4" rx="2" fill="url(#faviconGradient)"/>
    
    <!-- Financial chart bars -->
    <rect x="28" y="20" width="3" height="12" rx="1.5" fill="#22d3ee"/>
    <rect x="32" y="16" width="3" height="16" rx="1.5" fill="#06b6d4"/>
    <rect x="36" y="12" width="3" height="20" rx="1.5" fill="#0891b2"/>
  </g>
  
  <!-- Rising trend arrow -->
  <g stroke="url(#faviconAccent)" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M12 28 L16 24 L20 20 L24 16"/>
    <path d="M21 16 L24 16 L24 19" stroke="#22d3ee" stroke-width="2"/>
  </g>
  
  <!-- Tech connectivity dots -->
  <circle cx="26" cy="10" r="1.5" fill="#22d3ee"/>
  <circle cx="30" cy="6" r="1" fill="#06b6d4"/>
  <circle cx="34" cy="34" r="1" fill="#0891b2"/>
  
  <!-- Financial symbol -->
  <g fill="#22d3ee" font-family="Arial, sans-serif" font-size="8" font-weight="bold">
    <text x="15" y="36" text-anchor="middle">$</text>
  </g>
</svg>